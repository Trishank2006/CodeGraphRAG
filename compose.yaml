services:
  neo4j:
    image: neo4j:5.26.30
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${CODEGRAPHRAG_NEO4J_USER:-neo4j}/${CODEGRAPHRAG_NEO4J_PASSWORD:?Set CODEGRAPHRAG_NEO4J_PASSWORD in .env}"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: